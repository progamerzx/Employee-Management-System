# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-frontend
  namespace: ems
  labels:
    app.kubernetes.io/name: ems-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: employee-management-system
spec:
  replicas: 2                        # Run 2 replicas for basic availability
  selector:
    matchLabels:
      app: ems-frontend
  strategy:
    type: RollingUpdate              # Zero-downtime rolling updates
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ems-frontend
        app.kubernetes.io/name: ems-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: employee-management-system
    spec:
      # # ── Security context ───────────────────────────────────────────────────
      # # Nginx needs to run as root to bind port 80; use unprivileged port if
      # # you need a stricter policy (change to port 8080 in nginx.conf + below).
      # securityContext:
      #   runAsNonRoot: false

      containers:
        - name: ems-frontend
          image: ctslab/ems-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # ── Health checks ──────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          # ── Resource limits ────────────────────────────────────────────────
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          # # ── Container security ─────────────────────────────────────────────
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   capabilities:
          #     drop:
          #       - ALL
          #     add:
          #       - NET_BIND_SERVICE  # Required to bind port 80

---
# ── Service (LoadBalancer) ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ems-frontend
  namespace: ems
  labels:
    app.kubernetes.io/name: ems-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: employee-management-system
spec:
  type: LoadBalancer
  selector:
    app: ems-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
